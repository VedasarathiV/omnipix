<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='18' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3EO%3C/text%3E%3C/svg%3E" />
    <title>OmniPix Studio</title>
    <script>
      try {
        var pref = window.localStorage.getItem('studio.theme') || 'dark';
        var systemDark = !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
        var dark = pref === 'dark' || (pref === 'system' && systemDark);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default dark stands */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
