<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OmniPix Studio</title>
    <script>
      try {
        var pref = window.localStorage.getItem('studio.theme') || 'dark';
        var systemDark = !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
        var dark = pref === 'dark' || (pref === 'system' && systemDark);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* default dark stands */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
