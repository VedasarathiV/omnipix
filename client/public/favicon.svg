<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- OmniPix mark: the brand dot inside a broken routing ring.
       The gap in the ring is the "fallback" — traffic re-routes around it. -->
  <rect width="64" height="64" rx="14" fill="#16a34a"/>
  <circle cx="32" cy="32" r="9.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-opacity=".6"
          stroke-width="4.5" stroke-linecap="round" stroke-dasharray="86 27"
          transform="rotate(-60 32 32)"/>
</svg>
